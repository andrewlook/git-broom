[package]
name = "git-broom"
version = "0.1.1"
edition = "2024"
description = "Interactive TUI for cleaning up stale local git branches"
repository = "https://github.com/andrewlook/git-broom"
license = "MIT"

[dependencies]
anyhow = "1"
crossterm = "0.28"
ratatui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
