[package]
name = "git-broom"
version = "0.1.1"
edition = "2024"
rust-version = "1.85"
description = "Interactive TUI for cleaning up stale local git branches"
repository = "https://github.com/andrewlook/git-broom"
homepage = "https://github.com/andrewlook/git-broom"
license = "MIT"
readme = "README.md"
keywords = ["git", "cli", "tui", "branches", "cleanup"]
categories = ["command-line-utilities"]
include = [
  "/src/**",
  "/tests/**",
  "/Cargo.toml",
  "/Cargo.lock",
  "/README.md",
  "/CHANGELOG.md",
  "/CONTRIBUTING.md",
  "/LICENSE",
]

[dependencies]
anyhow = "1"
crossterm = "0.28"
ratatui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
