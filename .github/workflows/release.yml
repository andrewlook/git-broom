name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo artifacts
        uses: swatinem/rust-cache@v2

      - name: Resolve release version
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [[ -z "${VERSION}" ]]; then
            echo "Failed to read version from Cargo.toml" >&2
            exit 1
          fi

          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            TAG_VERSION="${GITHUB_REF_NAME#v}"
            if [[ "${TAG_VERSION}" != "${VERSION}" ]]; then
              echo "Tag ${GITHUB_REF_NAME} does not match Cargo.toml version ${VERSION}" >&2
              exit 1
            fi
          fi

          if ! grep -q "^## \[${VERSION}\]" CHANGELOG.md; then
            echo "CHANGELOG.md is missing a section for ${VERSION}" >&2
            exit 1
          fi

          {
            echo "VERSION=${VERSION}"
            echo "CRATE_ARCHIVE=target/package/git-broom-${VERSION}.crate"
          } >> "${GITHUB_ENV}"

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test

      - name: Validate publish
        run: cargo publish --dry-run --locked

      - name: Package crate
        run: |
          cargo package --locked
          cargo package --list > target/package/package-contents.txt

      - name: Build release notes
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "# git-broom ${VERSION}"
            echo
            awk -v version="${VERSION}" '
              $0 ~ "^## \\[" version "\\]" { in_section = 1; next }
              in_section && $0 ~ "^## \\[" { exit }
              in_section { print }
            ' CHANGELOG.md
          } > target/package/release-notes.md

      - name: Upload packaged crate
        uses: actions/upload-artifact@v4
        with:
          name: git-broom-release-${{ env.VERSION }}
          path: |
            ${{ env.CRATE_ARCHIVE }}
            target/package/package-contents.txt
            target/package/release-notes.md

      - name: Require crates.io token
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          STATUS=$(curl -s -o /tmp/crate-version.json -w "%{http_code}" "https://crates.io/api/v1/crates/git-broom/${VERSION}")
          if [[ "${STATUS}" == "200" ]]; then
            echo "CRATE_ALREADY_PUBLISHED=true" >> "${GITHUB_ENV}"
            exit 0
          fi
          echo "CRATE_ALREADY_PUBLISHED=false" >> "${GITHUB_ENV}"
          if [[ -z "${{ secrets.CARGO_REGISTRY_TOKEN }}" ]]; then
            echo "Missing CARGO_REGISTRY_TOKEN repository secret" >&2
            exit 1
          fi

      - name: Publish already handled locally
        if: github.ref_type == 'tag' && env.CRATE_ALREADY_PUBLISHED == 'true'
        shell: bash
        run: |
          echo "git-broom ${VERSION} is already published on crates.io; skipping publish."

      - name: Publish to crates.io
        if: github.ref_type == 'tag' && env.CRATE_ALREADY_PUBLISHED != 'true'
        run: cargo publish --locked --token "${{ secrets.CARGO_REGISTRY_TOKEN }}"

      - name: Create GitHub release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          body_path: target/package/release-notes.md
          files: |
            ${{ env.CRATE_ARCHIVE }}
            target/package/package-contents.txt
